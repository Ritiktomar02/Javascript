<!DOCTYPE html>
<html>
   <head>
      <title>4 Different Ways to Center an Element using CSS</title>
      <style>
         .parent {
         height: 400px;
         width: 400px;
         border:2px solid red;
         position: relative;
         }
         .child {
         height: 100px;
         width: 100px;
         background-color: lightgreen;
         margin: auto;
         position:absolute;
         top:20px;
         right:0;
         left:0;
         bottom: 0;
         }
      </style>
   </head>
   <body>
      <div class="parent">
         <div class="child">
            Green Div is Centered
         </div>
      </div>
   </body>
</html>
